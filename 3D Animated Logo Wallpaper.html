<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>3D Logo Wallpaper</title>
<style>
  :root { --bg-a:#22222a; --bg-b:#08080b; --hint:#8a8a96; }
  html,body { margin:0; height:100%; overflow:hidden; background:#08080b; }
  body { background:radial-gradient(ellipse at 50% 45%, var(--bg-a) 0%, var(--bg-b) 75%); font-family:system-ui,sans-serif; }
  canvas { display:block; width:100%; height:100%; }
  #hint { position:fixed; left:0; right:0; bottom:calc(18px + env(safe-area-inset-bottom,0px)); text-align:center;
          color:var(--hint); font-size:13px; letter-spacing:.02em; transition:opacity 1.2s; pointer-events:none; }
</style>
</head>
<body>
<canvas id="c"></canvas>
<div id="hint">Move your mouse to tilt the logo. Double-click for fullscreen.</div>
<script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js"></script>
<script>
(function(){
  const canvas = document.getElementById('c');
  const renderer = new THREE.WebGLRenderer({canvas, antialias:true, alpha:true});
  renderer.setPixelRatio(Math.min(window.devicePixelRatio||1, 2));
  const scene = new THREE.Scene();
  const camera = new THREE.PerspectiveCamera(35, 1, 0.1, 100);
  camera.position.set(0, 0, 11);

  // lights
  scene.add(new THREE.AmbientLight(0xffffff, 0.45));
  const key = new THREE.DirectionalLight(0xffffff, 1.1); key.position.set(4,5,8); scene.add(key);
  const rim = new THREE.PointLight(0xff2a2a, 2.2, 30); rim.position.set(-6,-3,4); scene.add(rim);
  const rim2 = new THREE.PointLight(0xff6a4a, 1.4, 30); rim2.position.set(6,3,-3); scene.add(rim2);

  const S = 0.0105;                       // logo units -> scene units
  const P = (x,y) => new THREE.Vector2((x-405)*S, -(y-364)*S);
  const shapeFrom = pts => { const s = new THREE.Shape(); pts.forEach((p,i)=>{const v=P(p[0],p[1]); i?s.lineTo(v.x,v.y):s.moveTo(v.x,v.y);}); s.closePath(); return s; };
  const mir = pts => pts.map(p=>[810-p[0],p[1]]);

  const matA = new THREE.MeshStandardMaterial({color:0xe8202a, metalness:0.55, roughness:0.28});
  const matG = new THREE.MeshStandardMaterial({color:0xb81822, metalness:0.7, roughness:0.35});
  const bevel = {bevelEnabled:true, bevelThickness:0.05, bevelSize:0.04, bevelSegments:3};

  // ---- the A ----
  const band = [[185,365],[405,430],[625,365],[580,445],[405,458],[230,445]];
  const legL = [[185,365],[230,445],[120,610],[190,618],[285,492],[375,492],[270,648],[12,648]];
  const top  = [[405,98],[445,110],[595,322],[405,395],[215,322],[365,110]];
  const hole = [[405,190],[495,300],[405,355],[315,300]];

  const logo = new THREE.Group();
  const aGroup = new THREE.Group(); logo.add(aGroup);
  [band, legL, mir(legL)].forEach(p => aGroup.add(new THREE.Mesh(new THREE.ExtrudeGeometry(shapeFrom(p), Object.assign({depth:0.45}, bevel)), matA)));
  const topShape = shapeFrom(top);
  topShape.holes.push(new THREE.Path(hole.map(p=>P(p[0],p[1]))));
  const topMesh = new THREE.Mesh(new THREE.ExtrudeGeometry(topShape, Object.assign({depth:0.45}, bevel)), matA);
  topMesh.position.z = 0.35;              // top piece floats slightly forward
  aGroup.add(topMesh);

  // ---- gear + ring (behind the A) ----
  const gearGroup = new THREE.Group(); gearGroup.position.z = -0.7; logo.add(gearGroup);
  const gc = P(405,390);                  // gear centre in scene units
  const N = 36, K = Math.tanh(2.2);
  const ringPts = off => { const a=[]; for(let k=0;k<N*40;k++){ const t=2*Math.PI*k/(N*40);
      const r=(382+17*Math.tanh(2.2*Math.cos(N*t))/K+off)*S; a.push(new THREE.Vector2(r*Math.cos(t-Math.PI/2), -r*Math.sin(t-Math.PI/2))); } return a; };
  const gearShape = new THREE.Shape(ringPts(8)); gearShape.holes.push(new THREE.Path(ringPts(-8)));
  const gear = new THREE.Mesh(new THREE.ExtrudeGeometry(gearShape, Object.assign({depth:0.3}, {bevelEnabled:true, bevelThickness:0.03, bevelSize:0.03, bevelSegments:2})), matG);
  const spin = new THREE.Group(); spin.position.set(gc.x, gc.y, 0); spin.add(gear); gearGroup.add(spin);

  const rr = 330*S;
  const circ = new THREE.Shape(); circ.absarc(0,0,rr+0.045,0,Math.PI*2,false);
  const chole = new THREE.Path(); chole.absarc(0,0,rr-0.045,0,Math.PI*2,true); circ.holes.push(chole);
  const ring = new THREE.Mesh(new THREE.ExtrudeGeometry(circ, {depth:0.18, bevelEnabled:false, curveSegments:96}), matG);
  ring.position.set(gc.x, gc.y, 0.05); gearGroup.add(ring);

  scene.add(logo);

  // ---- floating sparks ----
  const cnt = 140, pos = new Float32Array(cnt*3), seed = [];
  for(let i=0;i<cnt;i++){ pos[i*3]=(Math.random()-.5)*16; pos[i*3+1]=(Math.random()-.5)*9; pos[i*3+2]=-4+Math.random()*7; seed.push(Math.random()*6.28); }
  const pg = new THREE.BufferGeometry(); pg.setAttribute('position', new THREE.BufferAttribute(pos,3));
  const sparks = new THREE.Points(pg, new THREE.PointsMaterial({color:0xff3b3b, size:0.04, transparent:true, opacity:0.7, depthWrite:false}));
  scene.add(sparks);

  // ---- interaction ----
  const mouse = {x:0,y:0}, tgt = {x:0,y:0};
  addEventListener('pointermove', e => { mouse.x = e.clientX/innerWidth*2-1; mouse.y = e.clientY/innerHeight*2-1; });
  addEventListener('dblclick', () => { document.fullscreenElement ? document.exitFullscreen() : document.documentElement.requestFullscreen().catch(()=>{}); });
  setTimeout(()=>{ document.getElementById('hint').style.opacity = 0; }, 6000);

  function resize(){
    const w = innerWidth, h = innerHeight;
    renderer.setSize(w, h, false);
    camera.aspect = w/h;
    camera.position.z = h/w > 0.8 ? 11 + (h/w-0.8)*14 : 11;   // keep logo fully visible on tall screens
    camera.updateProjectionMatrix();
  }
  addEventListener('resize', resize); resize();

  const reduce = matchMedia('(prefers-reduced-motion: reduce)').matches;
  const clock = new THREE.Clock();
  function frame(){
    const t = clock.getElapsedTime();
    const intro = Math.min(1, t/2.2), ease = 1-Math.pow(1-intro,3);
    tgt.x += (mouse.x - tgt.x)*0.04; tgt.y += (mouse.y - tgt.y)*0.04;
    const m = reduce ? 0 : 1;
    logo.rotation.y = (1-ease)*Math.PI*1.5 + Math.sin(t*0.5)*0.45*m + tgt.x*0.35;
    logo.rotation.x = Math.sin(t*0.37)*0.12*m + tgt.y*0.22;
    logo.position.y = Math.sin(t*0.8)*0.12*m;
    logo.scale.setScalar(0.4 + 0.6*ease);
    spin.rotation.z = -t*0.25*m;
    topMesh.position.z = 0.35 + Math.sin(t*0.9)*0.12*m;
    rim.position.x = Math.cos(t*0.6)*7; rim2.position.y = Math.sin(t*0.5)*4;
    sparks.rotation.y = t*0.02*m;
    const p = pg.attributes.position;
    for(let i=0;i<cnt;i++){ p.array[i*3+1] += 0.003*m; if(p.array[i*3+1]>4.5) p.array[i*3+1] = -4.5; }
    p.needsUpdate = true;
    renderer.render(scene, camera);
    requestAnimationFrame(frame);
  }
  frame();
})();
</script>
</body>
</html>
